<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(120, 120)">
    <!-- Progress/Experience concept: Steps leading to a trophy -->
    <path d="M-80 60 L-40 60 L-40 20 L0 20 L0 -20 L40 -20 L40 -60" stroke="#1C1C1E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Trophy at the top -->
    <g transform="translate(60, -80)">
       <path d="M-20 0 L20 0 L20 30 C20 45 -20 45 -20 30 Z" fill="#FFD60A"/>
       <path d="M-25 5 L-20 15 M25 5 L20 15" stroke="#FFD60A" stroke-width="6" stroke-linecap="round"/>
       <rect x="-5" y="40" width="10" height="10" fill="#FFD60A"/>
       <rect x="-15" y="50" width="30" height="5" rx="2" fill="#FFD60A"/>
    </g>
    
    <!-- Experience levels (dots on steps) -->
    <circle cx="-60" cy="60" r="6" fill="#1C1C1E" opacity="0.3"/>
    <circle cx="-20" cy="20" r="6" fill="#1C1C1E" opacity="0.6"/>
    <circle cx="20" cy="-20" r="6" fill="#1C1C1E"/>
  </g>
</svg>

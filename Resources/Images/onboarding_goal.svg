<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(120, 120)">
    <!-- Goal concept: Multiple paths leading up -->
    <path d="M-60 60 L-20 20 L0 40 L40 0 L80 40" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.2"/>
    <path d="M-60 40 L-10 -10 L20 20 L60 -20" stroke="#1C1C1E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Target icon -->
    <circle cx="60" cy="-20" r="30" stroke="#34C759" stroke-width="8" fill="none"/>
    <circle cx="60" cy="-20" r="10" fill="#34C759"/>
    
    <!-- Floating icons -->
    <g transform="translate(-40, -40)">
       <path d="M-10 0 L10 0 M0 -10 L0 10" stroke="#FFD60A" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(0, -70)">
       <circle cx="0" cy="0" r="5" fill="#FF3B30"/>
    </g>
  </g>
</svg>

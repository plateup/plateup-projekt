<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(120, 120)">
    <!-- Scale concept: Minimalist rounded square -->
    <rect x="-60" y="-60" width="120" height="120" rx="20" stroke="#1C1C1E" stroke-width="12" fill="none"/>
    
    <!-- Scale Display -->
    <rect x="-30" y="-45" width="60" height="30" rx="6" fill="#1C1C1E" opacity="0.1"/>
    <rect x="-20" y="-35" width="40" height="10" rx="2" fill="#1C1C1E"/>
    
    <!-- Scale lines (measurements) -->
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#1C1C1E" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="10" x2="-40" y2="30" stroke="#1C1C1E" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="0" y2="30" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="10" x2="40" y2="30" stroke="#1C1C1E" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Floating 'kg' and 'lbs' indicators -->
    <circle cx="-20" cy="80" r="15" stroke="#1C1C1E" stroke-width="4" fill="none"/>
    <path d="M-24 80 L-16 80" stroke="#1C1C1E" stroke-width="4" stroke-linecap="round"/>
    
    <circle cx="20" cy="80" r="15" fill="#34C759"/>
    <path d="M16 80 L24 80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

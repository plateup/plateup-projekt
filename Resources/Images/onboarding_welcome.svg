<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(120, 120)">
    <!-- Plate lifting up -->
    <circle cx="0" cy="0" r="80" stroke="#1C1C1E" stroke-width="24" fill="none" opacity="0.1"/>
    <!-- Person minimalist line art -->
    <g transform="translate(0, 40)">
      <!-- Head -->
      <circle cx="0" cy="-100" r="15" fill="#1C1C1E"/>
      <!-- Body/Spine -->
      <path d="M0 -85 L0 -20" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round"/>
      <!-- Arms lifting plate -->
      <path d="M0 -70 L-50 -100 L-40 -120" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M0 -70 L50 -100 L40 -120" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- Plate in hands -->
      <path d="M-60 -120 L60 -120" stroke="#1C1C1E" stroke-width="24" stroke-linecap="round"/>
      <circle cx="0" cy="-120" r="8" fill="#FFFFFF"/>
      <!-- Legs -->
      <path d="M0 -20 L-25 40" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round"/>
      <path d="M0 -20 L25 40" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- Upward trend lines -->
    <path d="M80 -60 L100 -80 L120 -60" stroke="#34C759" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
